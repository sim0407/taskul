<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>taskul</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>taskul</h1>
    <nav>
      <button type="button" id="btn-projects" class="nav-btn">プロジェクト一覧</button>
      <span id="board-title" class="board-title"></span>
    </nav>
  </header>
  <main>
    <section id="view-projects" class="view">
      <h2>プロジェクト</h2>
      <div class="toolbar-row">
        <button type="button" id="btn-new-project" class="btn-primary">新規作成</button>
        <button type="button" id="btn-seed-project" class="btn-back">サンプルを作成</button>
      </div>
      <ul id="project-list" class="project-list"></ul>
      <p class="hint">プロジェクトを選ぶとボードを表示します。</p>
    </section>
    <section id="view-board" class="view hidden">
      <div class="board-toolbar">
        <button type="button" id="btn-back" class="btn-back">← 一覧へ</button>
        <button type="button" id="btn-gantt" class="btn-blockers">ガント</button>
        <button type="button" id="btn-blockers" class="btn-blockers">ブロッカー一覧</button>
        <button type="button" id="btn-new-task" class="btn-primary">タスク追加</button>
        <button type="button" id="btn-add-dependency" class="btn-back">依存を追加</button>
      </div>
      <div id="board-lanes" class="board-lanes"></div>
    </section>
    <section id="view-gantt" class="view hidden">
      <div class="board-toolbar gantt-toolbar">
        <button type="button" id="btn-back-gantt" class="btn-back">← ボードへ</button>
        <label for="gantt-from">開始</label>
        <input type="date" id="gantt-from" class="gantt-date">
        <label for="gantt-to">終了</label>
        <input type="date" id="gantt-to" class="gantt-date">
        <button type="button" id="btn-gantt-apply" class="btn-primary">表示</button>
      </div>
      <div id="gantt-container" class="gantt-container"></div>
    </section>
    <section id="view-blockers" class="view hidden">
      <div class="board-toolbar">
        <button type="button" id="btn-back-blockers" class="btn-back">← ボードへ</button>
      </div>
      <ul id="blockers-list" class="blockers-list"></ul>
    </section>
    <div id="toast" class="toast hidden" role="alert"></div>
  </main>
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal" class="modal">
      <div class="modal-header">
        <h3 id="modal-title">—</h3>
        <button type="button" id="modal-close" class="modal-close" aria-label="閉じる">×</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
